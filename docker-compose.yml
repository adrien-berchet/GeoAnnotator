# Docker Compose configuration for GeoAnnotator
#
# Services:
#   - PostgreSQL with PostGIS extension
#   - Django backend
#   - React frontend (development)
#   - MinIO for S3-compatible storage
#
# Usage:
#   Development: docker-compose up
#   Production: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d

version: '3.8'

services:
  # PostgreSQL with PostGIS
  db:
    image: postgis/postgis:15-3.4
    container_name: geoannotator_db
    environment:
      POSTGRES_DB: geoannotator
      POSTGRES_USER: geoannotator
      POSTGRES_PASSWORD: ${DB_PASSWORD:-geoannotator_dev_password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5433:5432"  # Port externe 5433 pour éviter conflit avec PostgreSQL local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geoannotator"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - geoannotator_network

  # MinIO for S3-compatible storage
  minio:
    image: minio/minio:latest
    container_name: geoannotator_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - geoannotator_network

  # Redis for Celery broker
  redis:
    image: redis:7-alpine
    container_name: geoannotator_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - geoannotator_network

  # Django backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: geoannotator_backend
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      DEBUG: ${DEBUG:-True}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      FERNET_KEY: ${FERNET_KEY:-dev-fernet-key-change-in-production}

      # Database configuration
      DATABASE_URL: postgresql://${POSTGRES_USER:-geoannotator}:${DB_PASSWORD:-geoannotator_dev_password}@db:5432/${POSTGRES_DB:-geoannotator}
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-geoannotator}
      POSTGRES_USER: ${POSTGRES_USER:-geoannotator}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-geoannotator_dev_password}
      POSTGRES_PORT: "5432"

      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}

      # AWS S3 / MinIO configuration
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AWS_STORAGE_BUCKET_NAME: geoannotator
      AWS_S3_ENDPOINT_URL: http://minio:9000
      AWS_S3_USE_SSL: "False"

      # Email configuration
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-localhost}
      EMAIL_PORT: ${EMAIL_PORT:-25}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-False}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-False}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-noreply@geoannotator.local}

      # CORS
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000

      # Celery (result backend disabled to reduce Redis queries)
      CELERY_BROKER_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
      - media_files:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - geoannotator_network
    stdin_open: true
    tty: true

  # Celery worker for background tasks
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: geoannotator_celery_worker
    command: celery -A config worker --loglevel=info
    environment:
      DEBUG: ${DEBUG:-True}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      FERNET_KEY: ${FERNET_KEY:-dev-fernet-key-change-in-production}

      # Database configuration
      DATABASE_URL: postgresql://${POSTGRES_USER:-geoannotator}:${DB_PASSWORD:-geoannotator_dev_password}@db:5432/${POSTGRES_DB:-geoannotator}
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-geoannotator}
      POSTGRES_USER: ${POSTGRES_USER:-geoannotator}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-geoannotator_dev_password}
      POSTGRES_PORT: "5432"

      # Celery (result backend disabled to reduce Redis queries)
      CELERY_BROKER_URL: redis://redis:6379/0

      # Email configuration
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-localhost}
      EMAIL_PORT: ${EMAIL_PORT:-25}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-False}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-False}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-noreply@geoannotator.local}
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - geoannotator_network

  # Celery beat for scheduled tasks
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: geoannotator_celery_beat
    command: celery -A config beat --loglevel=info
    environment:
      DEBUG: ${DEBUG:-True}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      FERNET_KEY: ${FERNET_KEY:-dev-fernet-key-change-in-production}

      # Database configuration
      DATABASE_URL: postgresql://${POSTGRES_USER:-geoannotator}:${DB_PASSWORD:-geoannotator_dev_password}@db:5432/${POSTGRES_DB:-geoannotator}
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-geoannotator}
      POSTGRES_USER: ${POSTGRES_USER:-geoannotator}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-geoannotator_dev_password}
      POSTGRES_PORT: "5432"

      # Celery (result backend disabled to reduce Redis queries)
      CELERY_BROKER_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - geoannotator_network

  # React frontend (development)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: geoannotator_frontend
    command: npm run dev -- --host
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - geoannotator_network
    stdin_open: true
    tty: true

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
  redis_data:
    driver: local
  media_files:
    driver: local

networks:
  geoannotator_network:
    driver: bridge
