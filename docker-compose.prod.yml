# Docker Compose configuration for GeoAnnotator (Production)
#
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d

version: '3.8'

services:
  # Override backend for production
  backend:
    build:
      target: production
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 60
    environment:
      DEBUG: "False"
      # Other production environment variables from .env file

  # Frontend with Nginx for production
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    command: nginx -g "daemon off;"
    ports:
      - "80:80"
      - "443:443"  # For HTTPS (add SSL certificates configuration)
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Add SSL certificates volumes if using HTTPS
      # - ./ssl/cert.pem:/etc/nginx/ssl/cert.pem:ro
      # - ./ssl/key.pem:/etc/nginx/ssl/key.pem:ro

  # Remove development-specific volumes
  # (backend and frontend volumes are removed in production)
